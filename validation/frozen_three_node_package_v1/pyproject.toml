[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncd-frozen-three-node-proof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["neural-causal-decompiler==0.59.0", "ncd-proof-workbench==0.1.0"]

[project.scripts]
ncd-frozen-three-node = "frozen_three_node.__main__:main"

[tool.setuptools]
packages = ["frozen_three_node"]