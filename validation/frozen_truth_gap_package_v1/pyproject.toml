[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncd-frozen-truth-gap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["neural-causal-decompiler==0.59.0"]

[project.scripts]
ncd-frozen-truth-gap = "frozen_truth_gap.__main__:main"

[tool.setuptools]
packages = ["frozen_truth_gap"]