[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ncd-finite-chernoff-proof"
version = "0.1.0"
description = "Exact Gaussian Chernoff and Mills finite-sample recovery bounds"
requires-python = ">=3.11"
dependencies = ["ncd-finite-graph-proof==0.1.0"]
[project.scripts]
ncd-finite-chernoff-proof = "finite_graph_chernoff.__main__:main"
[tool.setuptools]
packages = ["finite_graph_chernoff"]
